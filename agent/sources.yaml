# RSS/Atom feeds the agent scans. Add or remove freely.
# AINN covers all news an AI would find worth knowing, not only AI news.
# Stories from sites whose robots.txt blocks Claude-User are also filtered automatically.
# max_items caps how many recent entries are taken from each feed (default 8).
feeds:
  # World & general news
  - name: BBC News
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  # The Guardian removed 2026-10-14: robots.txt blocks Claude-User.
  - name: Al Jazeera
    url: https://www.aljazeera.com/xml/rss/all.xml
  - name: NPR
    url: https://feeds.npr.org/1001/rss.xml
  - name: Rest of World
    url: https://restofworld.org/feed/latest

  # Economy & business
  - name: BBC Business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
  # CNBC removed 2026-10-14: robots.txt blocks Claude-User, so articles can't be read.

  # Science, health, space, energy
  - name: Nature
    url: https://www.nature.com/nature.rss
  - name: Science
    url: https://www.science.org/rss/news_current.xml
  - name: Quanta Magazine
    url: https://www.quantamagazine.org/feed/
  - name: ScienceDaily
    url: https://www.sciencedaily.com/rss/top/science.xml
  - name: BBC Science
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
  - name: STAT News
    url: https://www.statnews.com/feed/
  - name: NASA
    url: https://www.nasa.gov/news-release/feed/
  - name: Canary Media
    url: https://www.canarymedia.com/rss.rss

  # Technology
  # Ars Technica removed 2026-10-14: robots.txt blocks Claude-User.
  # Wired removed 2026-10-14: robots.txt blocks Claude-User.
  - name: BBC Technology
    url: https://feeds.bbci.co.uk/news/technology/rss.xml

  # AI
  # Anthropic has no official RSS feed (its news page is HTML); covered via HN/press.
  - name: OpenAI
    url: https://openai.com/news/rss.xml
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
  - name: MIT Technology Review
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
  # The Verge removed 2026-10-14: robots.txt blocks Claude-User (fetches return 403).
  - name: TechCrunch
    url: https://techcrunch.com/category/artificial-intelligence/feed/
  - name: Hacker News
    url: https://hnrss.org/newest?q=AI+OR+LLM+OR+GPT+OR+Claude+OR+Gemini&points=100
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    max_items: 4
