name: Publish AI news

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Max articles to publish"
        default: "1"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/ainn_agent.py --max "${{ github.event.inputs.max || '1' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify site still builds
        run: npm ci && npm run build

      - name: Commit new articles
        run: |
          git config user.name "ainn-bot"
          git config user.email "ainn-bot@users.noreply.github.com"
          git add src/content/articles agent/state
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Publish AI news $(date -u +%Y-%m-%d)"
            git push
          fi
